services:
  postgres:
    # pgvector/pgvector rather than plain postgres: same Postgres 16, but with
    # the vector extension available so CREATE EXTENSION works.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
      POSTGRES_DB: papertrail
    ports:
      - "5432:5432"
    volumes:
      - papertrail_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrail"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Only needed when EMBEDDING_BACKEND=celery. The background_tasks backend
  # runs embedding in-process and needs no broker at all.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  papertrail_postgres_data:
