[pytest]
markers =
    pg: needs a real Postgres with the pgvector extension. Skipped unless
        TEST_DATABASE_URL is set, so the default suite still runs with zero
        external services. Run with:
        TEST_DATABASE_URL=postgresql+psycopg2://papertrail:papertrail@localhost:5432/papertrail_test python -m pytest -m pg
    supabase: needs real Supabase Storage credentials and network. Skipped
        unless the SUPABASE_* settings are configured (backend/.env is read,
        same as the app), so the default suite stays offline.
        Run with: make test-supabase
