# Render infrastructure-as-code for the backend.
#
# Secrets are deliberately left unset (sync: false) — Render prompts for them
# on first deploy rather than storing them in the repo. See backend/.env.example
# for what each one is and where to get it.
services:
  - type: web
    name: papertrail-api
    runtime: python
    plan: free
    rootDir: backend
    # Fetch the embedding model at build time, not on the first request: the
    # free tier's disk doesn't survive a restart, so a runtime download would
    # repeat after every cold start. Mirrors exactly what _load() fetches.
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from huggingface_hub import hf_hub_download; from tokenizers import Tokenizer;
      hf_hub_download('BAAI/bge-small-en-v1.5', 'onnx/model.onnx');
      Tokenizer.from_pretrained('BAAI/bge-small-en-v1.5')"
    # Free web services sleep when idle, which is why EMBEDDING_BACKEND is set
    # to background_tasks below: there is no always-on worker to hand jobs to.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"

      # Explicit so the build-time download and the running service agree on
      # where the model lives.
      - key: HF_HOME
        value: /opt/render/project/src/.hf-cache

      # Neon (free tier keeps pgvector and doesn't expire like Render's free
      # Postgres). Its connection string works as-is, e.g.
      # postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Free-tier disk does not survive a restart or a spin-down, so uploads
      # go to a private Cloudflare R2 bucket instead of LOCAL_STORAGE_ROOT.
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_BUCKET
        sync: false

      # No Celery worker and no Redis on the free tier.
      - key: EMBEDDING_BACKEND
        value: background_tasks
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5

      - key: ENVIRONMENT
        value: production

      # The GitHub Pages origin, with no path: https://agreywhale.github.io
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

      # Secrets — filled in via the Render dashboard on first deploy.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CROSSREF_CONTACT_EMAIL
        sync: false
      # R2 API token scoped to the bucket — server-side only, never sent to
      # the browser.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
