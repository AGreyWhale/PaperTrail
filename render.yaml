# Render infrastructure-as-code for the backend.
#
# Secrets are deliberately left unset (sync: false) — Render prompts for them
# on first deploy rather than storing them in the repo. See backend/.env.example
# for what each one is and where to get it.
services:
  - type: web
    name: papertrail-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"
    # Free web services sleep when idle, which is why EMBEDDING_BACKEND is set
    # to background_tasks below: there is no always-on worker to hand jobs to.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"

      # Wired automatically from the database defined below.
      - key: DATABASE_URL
        sync: false

      # Free-tier disk does not survive a restart or a spin-down, so uploads
      # go to a private Supabase Storage bucket instead of LOCAL_STORAGE_ROOT.
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        sync: false

      # No Celery worker and no Redis on the free tier.
      - key: EMBEDDING_BACKEND
        value: background_tasks
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5

      - key: ENVIRONMENT
        value: production

      # Set to the deployed frontend origin, e.g. https://papertrail.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false

      # Secrets — filled in via the Render dashboard on first deploy.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CROSSREF_CONTACT_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Service role key — server-side only, never sent to the browser.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
